name: Verificar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilación y pruebas completas
        run: mvn -B verify
      - name: Construcción de imagen Docker
        run: docker build -t norma:verificada .
      - name: Smoke test de contenedor y persistencia
        shell: bash
        run: |
          set -euo pipefail

          SMOKE_ID="${GITHUB_RUN_ID:-smoke-$RANDOM}"
          CONT_NAME="norma-ci-smoke-${SMOKE_ID}"
          RECREATED_NAME="norma-ci-recreated-${SMOKE_ID}"
          VOL_NAME="norma-ci-vol-${SMOKE_ID}"

          cleanup() {
            local exit_code=$?
            echo "Ejecutando limpieza CI (código de salida: $exit_code)..."
            if [ "$exit_code" -ne 0 ]; then
              echo "--- Logs de contenedor principal ($CONT_NAME) ---"
              docker logs "$CONT_NAME" 2>/dev/null || true
              echo "--- Logs de contenedor recreado ($RECREATED_NAME) ---"
              docker logs "$RECREATED_NAME" 2>/dev/null || true
            fi
            docker stop "$CONT_NAME" 2>/dev/null || true
            docker rm "$CONT_NAME" 2>/dev/null || true
            docker stop "$RECREATED_NAME" 2>/dev/null || true
            docker rm "$RECREATED_NAME" 2>/dev/null || true
            docker volume rm "$VOL_NAME" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker volume create "$VOL_NAME"

          docker run -d \
            --name "$CONT_NAME" \
            -p 0:8080 \
            -v "$VOL_NAME:/data" \
            norma:verificada

          HOST_PORT=$(docker port "$CONT_NAME" 8080 | head -n 1 | sed 's/.*://')
          echo "Contenedor iniciado en puerto host dinámico: $HOST_PORT"

          READY=0
          for i in {1..35}; do
            if curl -s -f --max-time 3 "http://127.0.0.1:$HOST_PORT/api/ping" | grep -q "PONG"; then
              echo "Contenedor listo en el intento $i"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "ERROR: El contenedor no respondió en /api/ping dentro del tiempo límite"
            exit 1
          fi

          # 1. Verificar catálogo inicial (8 productos y campos esperados vía parser python3)
          SESS_ID="ci-session-valid-1"
          curl -s -f --max-time 5 "http://127.0.0.1:$HOST_PORT/api/products?sessionId=$SESS_ID" > catalog_init.json
          python3 -c '
          import json, sys
          with open("catalog_init.json") as f:
              items = json.load(f)
          if len(items) != 8:
              sys.exit(f"Esperados 8 productos iniciales, encontrados {len(items)}")
          for p in items:
              for field in ["pieceNumber", "title", "price", "imageUrl", "sold"]:
                  if field not in p:
                      sys.exit(f"Campo {field} ausente en producto: {p}")
          p2 = next(p for p in items if p["pieceNumber"] == 2)
          p2_price = p2["price"]
          if p2_price != 18500:
              sys.exit(f"Precio inicial de pieza 2 esperado 18500, encontrado {p2_price}")
          print("Catálogo inicial verificado con 8 productos válidos")
          '

          # 2. Proponer mutación de precio
          curl -s -f --max-time 25 -X POST \
            -F "sessionId=$SESS_ID" \
            -F "text=A la número 2 subila a veinte mil pesos" \
            "http://127.0.0.1:$HOST_PORT/api/bot/message" > prop.json
          python3 -c '
          import json, sys
          with open("prop.json") as f:
              d = json.load(f)
          st = d.get("state")
          if st != "AWAITING_CONFIRMATION":
              sys.exit(f"Estado de propuesta esperado AWAITING_CONFIRMATION, recibido: {st}")
          print("Propuesta de mutación validada en estado AWAITING_CONFIRMATION")
          '

          # 3. Cancelar propuesta ("No") y verificar no-mutación
          curl -s -f --max-time 25 -X POST \
            -F "sessionId=$SESS_ID" \
            -F "text=No" \
            "http://127.0.0.1:$HOST_PORT/api/bot/message" > cancel.json
          python3 -c '
          import json, sys
          with open("cancel.json") as f:
              d = json.load(f)
          st = d.get("state")
          if st != "IDLE":
              sys.exit(f"Estado tras cancelacion esperado IDLE, recibido: {st}")
          print("Cancelación procesada exitosamente")
          '
          curl -s -f --max-time 5 "http://127.0.0.1:$HOST_PORT/api/products?sessionId=$SESS_ID" > catalog_cancel.json
          python3 -c '
          import json, sys
          with open("catalog_cancel.json") as f:
              items = json.load(f)
          p2 = next(p for p in items if p["pieceNumber"] == 2)
          p2_price = p2["price"]
          if p2_price != 18500:
              sys.exit(f"El precio de pieza 2 debe ser 18500 tras cancelar, encontrado: {p2_price}")
          print("Precio conservado en 18500 tras cancelación")
          '

          # 4. Proponer y confirmar mutación ("Sí")
          curl -s -f --max-time 25 -X POST \
            -F "sessionId=$SESS_ID" \
            -F "text=A la número 2 subila a veinte mil pesos" \
            "http://127.0.0.1:$HOST_PORT/api/bot/message" > prop2.json
          curl -s -f --max-time 25 -X POST \
            -F "sessionId=$SESS_ID" \
            -F "text=Sí" \
            "http://127.0.0.1:$HOST_PORT/api/bot/message" > confirm.json
          python3 -c '
          import json, sys
          with open("confirm.json") as f:
              d = json.load(f)
          st = d.get("state")
          if st != "IDLE":
              sys.exit(f"Estado tras confirmacion esperado IDLE, recibido: {st}")
          print("Confirmación procesada exitosamente")
          '
          curl -s -f --max-time 5 "http://127.0.0.1:$HOST_PORT/api/products?sessionId=$SESS_ID" > catalog_confirmed.json
          python3 -c '
          import json, sys
          with open("catalog_confirmed.json") as f:
              items = json.load(f)
          p2 = next(p for p in items if p["pieceNumber"] == 2)
          p2_price = p2["price"]
          if p2_price != 20000:
              sys.exit(f"Precio mutado esperado 20000, encontrado {p2_price}")
          print("Precio mutado a 20000 confirmado en catálogo")
          '

          # 5. Reinicio de contenedor (docker restart) y comprobación de persistencia de datos mutados
          docker restart "$CONT_NAME"
          HOST_PORT=$(docker port "$CONT_NAME" 8080 | head -n 1 | sed 's/.*://')
          echo "Puerto dinámico tras restart: $HOST_PORT"

          READY=0
          for i in {1..35}; do
            if curl -s -f --max-time 3 "http://127.0.0.1:$HOST_PORT/api/ping" | grep -q "PONG"; then
              echo "Contenedor reiniciado listo en el intento $i"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "ERROR: El contenedor reiniciado no respondió PONG"
            exit 1
          fi

          curl -s -f --max-time 5 "http://127.0.0.1:$HOST_PORT/api/products?sessionId=$SESS_ID" > catalog_restart.json
          python3 -c '
          import json, sys
          with open("catalog_restart.json") as f:
              items = json.load(f)
          p2 = next(p for p in items if p["pieceNumber"] == 2)
          p2_price = p2["price"]
          if p2_price != 20000:
              sys.exit(f"Falla de persistencia post-restart: esperado 20000, encontrado {p2_price}")
          print("Persistencia de datos mutados (20000) verificada tras restart")
          '

          # 6. Recreación de contenedor con el MISMO volumen
          docker stop "$CONT_NAME"
          docker rm "$CONT_NAME"

          docker run -d \
            --name "$RECREATED_NAME" \
            -p 0:8080 \
            -v "$VOL_NAME:/data" \
            norma:verificada

          RECREATED_PORT=$(docker port "$RECREATED_NAME" 8080 | head -n 1 | sed 's/.*://')
          READY=0
          for i in {1..35}; do
            if curl -s -f --max-time 3 "http://127.0.0.1:$RECREATED_PORT/api/ping" | grep -q "PONG"; then
              echo "Contenedor recreado listo en el intento $i"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "ERROR: El contenedor recreado no respondió PONG"
            exit 1
          fi

          curl -s -f --max-time 5 "http://127.0.0.1:$RECREATED_PORT/api/products?sessionId=$SESS_ID" > catalog_recreated.json
          python3 -c '
          import json, sys
          with open("catalog_recreated.json") as f:
              items = json.load(f)
          p2 = next(p for p in items if p["pieceNumber"] == 2)
          p2_price = p2["price"]
          if p2_price != 20000:
              sys.exit(f"Falla de persistencia tras recreacion: esperado 20000, encontrado {p2_price}")
          print("Persistencia de datos mutados (20000) verificada tras recreación con el MISMO volumen")
          '
          echo "Smoke test de contenedor y persistencia en CI completado con éxito."
