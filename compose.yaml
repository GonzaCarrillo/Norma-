services:
  taller:
    build: .
    ports:
      - "8080:8080"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - norma-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/ping',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  norma-data:
