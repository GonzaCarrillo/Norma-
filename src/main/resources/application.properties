# ===================================================================
# Contrato de configuracion de la base - El Taller de Norma (Issue #1)
# ===================================================================

# Nombre de la aplicacion
spring.application.name=taller-de-norma

# Puerto TCP de escucha HTTP (prevalece argumento CLI --server.port)
server.port=${PORT:8080}

# Habilitacion de Virtual Threads (Loom) en Java 25
spring.threads.virtual.enabled=true

# Fuente de datos SQLite (ruta local al archivo de base de datos)
spring.datasource.url=jdbc:sqlite:${NORMA_DB:norma.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Pool Hikari: conexion unica y tiempo de espera ante contencion
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

# Inicializacion DDL obligatoria desde schema.sql
spring.sql.init.mode=always

# Limites de subida de archivos multipart
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Seguridad: no divulgar mensajes de error internos en endpoints
server.error.include-message=never

# Directorio de almacenamiento para uploads
norma.uploads=${NORMA_UPLOADS:uploads}

# Clave opcional para proveedor Groq (sin llamada en arranque de base)
groq.api.key=${GROQ_API_KEY:}
